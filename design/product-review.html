<details class="scope"><summary>依据 SwiftUI 源码的交互示意，非 iOS 运行截图</summary><p>本页重现当前对话、历史、审批和发现入口的视觉结构；输入与选择仅留在页面内存，不联网、不执行命令、不收集账号。原生 App 已有 HTTPS 登录与设备发现，尚未接入远程对话。网页的大字、键盘与面板行为不替代原生 Dynamic Type、VoiceOver 或设备验证。参考来自 Claude 与 ChatGPT 官方商店截图中的应用布局；不使用它们的品牌、图片或模型名称。</p></details>

<section class="frame-wrap" aria-label="可交互界面"><div class="frame-caption"><span id="frame-name">iPhone</span><span>可交互</span></div><div id="app" class="app" data-theme="light"></div></section>
<section class="frame-wrap" id="comparison" hidden aria-label="相同界面的另一外观"><div class="frame-caption"><span>同一界面</span><span>另一外观 · 只读对照</span></div><div id="mirror" class="app" data-theme="dark" inert aria-hidden="true"></div></section>
</main>

<script>
'use strict';
const $ = id => document.getElementById(id);
const icon = (name, extra = '') => `<svg class="icon ${extra}" aria-hidden="true"><use href="#${name}"/></svg>`;
const esc = text => String(text).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iconButton = (name, label, action, extra = '') => `<button type="button" class="icon-button ${extra}" data-action="${action}" aria-label="${label}">${icon(name)}</button>`;
const textButton = (label, action) => `<button type="button" class="text-button" data-action="${action}">${label}</button>`;
const destination = (label, name, action) => `<button type="button" class="destination" data-action="${action}">${icon(name)}<span>${label}</span>${icon('chevron','chevron')}</button>`;
const baseReply = '这是一段预设回复，供你试用对话。\n\n梳理项目时，可以先看 README 里的用途和运行方式，再找程序入口，最后读一个核心流程对应的测试。把不确定的地方记成问题，再逐个验证。\n\n你可以继续输入，或从历史记录切换到另一个对话。';
const sessions = [
 {id:'reading',title:'阅读一个 Swift 项目',workspace:'示例 / notes',draft:'',messages:[{role:'user',text:'拿到一个 Swift 项目，先看哪些文件？'},{role:'assistant',text:'先看 README，了解项目用途与运行方式。\n\n接着找 App 或 main 入口，顺着一个具体操作往下读，例如保存一条笔记。遇到的数据类型和依赖可以边读边记，不必一开始就读完整个项目。\n\n最后看这条流程的测试，确认正常结果和失败情况。',reasoning:'沿着一条实际流程阅读，比逐个目录浏览更容易建立上下文。'}]},
 {id:'approval',title:'检查登录流程',workspace:'示例 / app',draft:'',pending:true,messages:[{role:'user',text:'确认登录测试前，需要看哪些信息？'},{role:'assistant',text:'下面是一条待确认操作的示例。打开后可以查看电脑、工作区、命令与影响范围，再选择允许一次或拒绝。'}]},
 {id:'notes',title:'整理阅读笔记',workspace:'示例 / notes',draft:'',messages:[{role:'user',text:'怎样记录读代码时的问题？'},{role:'assistant',text:'每条笔记留三个部分：正在看的流程、已经确认的行为、还需要验证的问题。附上文件和函数名，下一次就能从同一个位置继续。'}]},
 {id:'empty',title:'新对话',workspace:'本地工作区',draft:'',messages:[]}
];
const now = Date.now(); sessions.forEach((s, i) => { s.updated = now - i * 60000; });
let selected = 'reading', demo = true, resumeDemo = true, panel = null, search = '', large = false, tablet = false, compare = false, theme = 'light', returnPanel = 'history';
const streams = new Map();
const composingInputs = new WeakSet();
const current = () => sessions.find(s => s.id === selected);
const say = text => { $('announcement').textContent = text; };
function titleNav(title, subtitle = '', actions = true) {
 return `<header class="nav">${!tablet || window.innerWidth <= 600 ? iconButton('menu','历史记录','history') : '<span></span>'}${subtitle ? `<button type="button" class="nav-title" data-action="info"><span class="title-line">${esc(title)}</span><small>${subtitle}</small></button>` : `<h2 class="nav-title">${esc(title)}</h2>`}${actions ? iconButton('new','新对话','new') : '<span></span>'}</header>`;
}
function historyRows() {
 const list = sessions.filter(s => `${s.title} ${s.workspace}`.toLocaleLowerCase().includes(search.toLocaleLowerCase())).sort((a,b) => b.updated-a.updated);
 return list.map(s => `<button type="button" class="history-row ${s.id === selected ? 'selected' : ''}" data-session="${s.id}" ${s.id === selected ? 'aria-current="true"' : ''}><span class="history-title">${esc(s.title)}${s.id === selected ? icon('check') : ''}</span><span class="history-meta"><span>${esc(s.draft ? `草稿：${s.draft}` : s.workspace)}</span><span>${s.pending ? '待确认' : new Date(s.updated).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false})}</span></span></button>`).join('') || '<p class="list-label">没有找到相关对话</p>';
}
function historyBody() {
 return `<div class="history-body">${demo ? `<label class="search">${icon('search')}<input type="search" data-search placeholder="搜索对话或工作区" aria-label="搜索对话或工作区" value="${esc(search)}"></label><p class="list-label">本地对话</p><div data-history-list>${historyRows()}</div>` : `${textButton('继续本地演示','enter')}<p class="form-note">本次打开的对话和草稿已保留。</p>`}</div><nav class="destinations" aria-label="其他页面">${destination('电脑','computer','computers')}${destination('设置','settings','settings')}</nav>`;
}
function sidebar() { return `<aside class="sidebar" aria-label="历史记录"><header class="nav"><span></span><h2 class="nav-title">历史记录</h2>${demo ? iconButton('new','新对话','new') : '<span></span>'}</header>${historyBody()}</aside>`; }
function messagesHTML(s) {
 return s.messages.map((m,i) => m.role === 'user' ? `<div class="message user" aria-label="你：${esc(m.text)}">${esc(m.text)}</div>` : `<div class="message">${m.reasoning ? `<details class="reasoning"><summary>${icon('lines','small-icon')}思路</summary><p>${esc(m.reasoning)}</p></details>` : ''}<div class="assistant" data-message="${i}" aria-label="助手回复">${esc(m.text || '正在生成…')}</div>${!m.streaming ? `<button type="button" class="icon-button copy" data-copy="${i}" aria-label="复制回复">${icon('copy')}</button>` : ''}</div>`).join('');
}
function approvalCard() { return `<button type="button" class="approval-card" data-action="approval">${icon('hand')}<span><strong>等待确认</strong><code>swift test</code><small>示例 Mac · ~/Projects/app</small></span>${icon('chevron','chevron')}</button>`; }
function chat() {
 const s = current();
 return `${titleNav(s.title,'本地演示')}<div class="transcript" data-transcript tabindex="0" aria-label="对话内容">${s.messages.length ? `<div class="reading">${messagesHTML(s)}${s.pending ? approvalCard() : ''}${s.interrupted ? `<p class="paused">${icon('pause','small-icon')}已暂停，可继续发送消息</p>` : ''}</div>` : `<div class="empty"><h2>有什么想聊的？</h2><button type="button" class="suggestion" data-action="example" ${s.draft.length ? 'hidden' : ''}>从哪里开始读一个项目${icon('insert')}</button></div>`}</div>${iconButton('down','回到最新','latest','latest')}<footer class="composer-area"><div class="composer-limit">${s.pending ? '<button type="button" class="composer-review" data-action="approval">先查看待确认操作</button>' : ''}<div class="composer"><textarea rows="1" data-composer aria-label="消息" placeholder="发消息…">${esc(s.draft)}</textarea><button type="button" class="send ${s.streaming ? 'stop' : ''}" data-action="${s.streaming ? 'stop' : 'send'}" aria-label="${s.streaming ? '停止生成' : '发送消息'}" ${!s.streaming && (!s.draft.trim() || s.pending) ? 'disabled' : ''}><span>${icon(s.streaming ? 'stop' : 'up')}</span></button></div></div></footer>`;
}
function entry() { return `${titleNav('DSH','',false)}<div class="entry"><div class="entry-content"><h2>从一个对话开始</h2><p>演示使用预设回复；远程对话暂未开放。</p><div>${destination(resumeDemo ? '继续本地演示' : '试用本地对话','chat','enter')}${destination('登录并发现电脑','computer','computers')}</div></div></div>`; }
function sheet(title, content, action = 'close', footer = '', kind = '') {
 return `<div class="overlay" data-backdrop><section class="sheet ${kind}" role="dialog" aria-modal="true" aria-label="${title}"><div class="handle" aria-hidden="true"></div><header class="nav">${textButton(action === 'back' ? '返回' : '关闭',action)}<h2 class="nav-title">${title}</h2><span></span></header>${content}${footer}</section></div>`;
}
function panelHTML() {
 if(panel === 'history') return sheet('历史记录',historyBody());
 if(panel === 'approval') {
  const valid = demo && current().pending;
  return sheet('确认操作',`<div class="sheet-body"><p class="detail-copy">${valid ? '运行项目测试，检查登录状态与错误处理。' : '请求已失效，不能再记录授权。关闭后可继续对话。'}</p><dl class="location"><div><dt>电脑</dt><dd>示例 Mac</dd></div><div><dt>工作区</dt><dd class="mono">~/Projects/app</dd></div></dl><hr class="rule"><h3 class="field-title">命令</h3><pre class="command">swift test</pre><h3 class="field-title">影响范围</h3><p class="scope-copy">测试代码可读写当前工作区，也可能访问网络；实际影响取决于测试内容。</p></div>`,'close',`<footer class="sheet-actions"><p>${valid ? '本地演示，只记录选择，不执行命令。' : '请求已失效，没有记录授权。'}</p><button type="button" class="primary" data-action="allow" ${valid ? '' : 'disabled'}>仅允许一次</button><button type="button" class="reject" data-action="reject" ${valid ? '' : 'disabled'}>拒绝这次操作</button></footer>`);
 }
 if(panel === 'info') return sheet('本地演示',`<div class="sheet-body info-body"><p>回复来自本机预设内容。审批只记录你的选择，不会调用模型或执行命令。</p><p>对话和草稿在本次打开期间保留，包括退出演示或登录账号后；关闭 App 后不保存。</p>${textButton('查看电脑','computers')}${textButton('退出演示，保留草稿','leave')}</div>`);
 if(panel === 'computers') return sheet('电脑',`<div class="sheet-body form-surface"><section class="form-group"><h3>登录后查看你的电脑</h3><p>使用电脑上的 Remote 服务和账号。当前可发现设备，远程对话暂未开放。</p>${textButton('登录并发现电脑','login')}</section><details class="form-group preparation"><summary>电脑端准备</summary><p>安装 ds-harness-remote 0.6.2，重启 Harness 后登录 Remote。这里需要填写相同的服务地址。</p></details></div>`);
 if(panel === 'login') return sheet('登录 Remote',`<div class="sheet-body form-surface"><p class="form-note">填写电脑正在使用的 Remote 服务和账号。</p><p class="form-label">Remote 服务</p><div class="form-group"><div class="field">https://remote.example.com</div></div><p class="form-note">可在电脑的 Remote 插件设置中查看。原生应用会向填写的地址发送账号信息。</p><p class="form-label">账号</p><div class="form-group"><div class="field">邮箱或账号</div><div class="field">密码</div></div><p class="form-note">此网页只展示表单结构，不接收凭据。登录与设备发现请在原生 App 中使用。</p></div>`,'back');
 if(panel === 'settings') return sheet('设置',`<div class="sheet-body form-surface"><p class="form-label">外观</p><section class="form-group"><label class="destination">显示模式<select data-app-theme aria-label="显示模式" style="margin-left:auto;max-width:60%;background:var(--canvas);color:var(--ink);border:0;min-height:44px"><option value="light" ${theme==='light'?'selected':''}>浅色</option><option value="dark" ${theme==='dark'?'selected':''}>深色</option></select></label></section><p class="form-label">Remote 账号</p><section class="form-group">${textButton('登录 Remote','login')}</section><p class="form-label">本地演示</p><section class="form-group">${textButton(demo?'退出演示，保留草稿':'继续本地演示',demo?'leave':'enter')}</section><p class="form-note">回复使用预设内容，不执行命令。对话与草稿在本次打开期间保留，关闭 App 后不保存。</p><p class="form-label">关于 DSH</p><section class="form-group"><p>为 DeepSeek Harness 设计的独立客户端，不隶属于 DeepSeek。</p></section></div>`);
 return '';
}
function mirror() {
 $('mirror').innerHTML = $('app').innerHTML;
 $('mirror').className = $('app').className;
 $('mirror').dataset.theme = theme === 'light' ? 'dark' : 'light';
 $('mirror').querySelectorAll('[autofocus]').forEach(e => e.removeAttribute('autofocus'));
 const composer=$('app').querySelector('[data-composer]'), otherComposer=$('mirror').querySelector('[data-composer]');
 if(composer && otherComposer)otherComposer.value=composer.value;
 const source = $('app').querySelector('[data-transcript]');
 const target = $('mirror').querySelector('[data-transcript]');
 if(source && target) target.scrollTop = source.scrollTop;
}
function render({focus, bottom = false, preserveScroll = false} = {}) {
 const oldScroll = $('app').querySelector('[data-transcript]')?.scrollTop || 0;
 $('app').innerHTML = `<div class="base" ${panel ? 'inert' : ''}>${tablet ? sidebar() : ''}<section class="detail" aria-label="${demo ? '对话' : '开始'}">${demo ? chat() : entry()}</section></div>${panelHTML()}`;
 $('app').className = `app${tablet ? ' tablet' : ''}${large ? ' large' : ''}`;
 $('app').dataset.theme = theme;
 $('theme').value = theme;
 $('frame-name').textContent = tablet ? 'iPad' : 'iPhone';
 const transcript = $('app').querySelector('[data-transcript]');
 if(transcript) { if(bottom) transcript.scrollTop = transcript.scrollHeight; else if(preserveScroll) transcript.scrollTop = oldScroll; transcript.addEventListener('scroll',updateLatest,{passive:true}); }
 resizeComposer(); updateLatest(); mirror();
 if(focus) $('app').querySelector(focus)?.focus({preventScroll:true});
 else if(panel) $('app').querySelector('.sheet button')?.focus({preventScroll:true});
}
function updateLatest() {
 const transcript = $('app').querySelector('[data-transcript]'), button = $('app').querySelector('[data-action=latest]');
 if(button && transcript) button.hidden = transcript.scrollHeight-transcript.scrollTop-transcript.clientHeight < 80;
 if(compare) { const other = $('mirror').querySelector('[data-transcript]'); if(other && transcript) other.scrollTop=transcript.scrollTop; const otherButton=$('mirror').querySelector('[data-action=latest]'); if(otherButton && button) otherButton.hidden=button.hidden; }
}
function resizeComposer() { const input=$('app').querySelector('[data-composer]'); if(input) { input.style.height='auto';input.style.height=`${Math.min(input.scrollHeight,160)}px`; } }
function updateComposerState() {
 const s=current(), input=$('app').querySelector('[data-composer]');if(!input)return;
 const button=$('app').querySelector('.composer .send'), action=s.streaming?'stop':'send';
 if(button.dataset.action!==action) {button.dataset.action=action;button.innerHTML=`<span>${icon(s.streaming?'stop':'up')}</span>`;}
 button.classList.toggle('stop',!!s.streaming);
 button.setAttribute('aria-label',s.streaming?'停止生成':'发送消息');
 button.disabled=!s.streaming && (!input.value.trim() || s.pending || composingInputs.has(input));
 const suggestion=$('app').querySelector('[data-action=example]');
 if(suggestion)suggestion.hidden=input.value.length>0 || composingInputs.has(input);
}
function finishStreamingView(s) {
 if(selected!==s.id || !demo)return;
 const transcript=$('app').querySelector('[data-transcript]');
 const following=transcript && transcript.scrollHeight-transcript.scrollTop-transcript.clientHeight<80;
 const index=s.messages.length-1, reply=$('app').querySelector(`[data-message="${index}"]`);
 if(reply && !reply.parentElement.querySelector('[data-copy]'))reply.insertAdjacentHTML('afterend',`<button type="button" class="icon-button copy" data-copy="${index}" aria-label="复制回复">${icon('copy')}</button>`);
 if(s.interrupted && transcript && !transcript.querySelector('.paused'))transcript.querySelector('.reading')?.insertAdjacentHTML('beforeend',`<p class="paused">${icon('pause','small-icon')}已暂停，可继续发送消息</p>`);
 // Keep the live textarea untouched: replacing it cancels IME and loses selection.
 updateComposerState();
 if(following)transcript.scrollTop=transcript.scrollHeight;
 updateLatest();if(compare)mirror();
}
function openPanel(next) { if(next === 'login') returnPanel=panel; panel=next; render({preserveScroll:true}); }
function newConversation() {
 let blank = sessions.find(s => !s.messages.length && !s.draft && !s.pending);
 if(!blank) { blank={id:`chat-${Date.now()}`,title:'新对话',workspace:'本地工作区',draft:'',messages:[],updated:Date.now()};sessions.push(blank); }
 selected=blank.id;demo=true;panel=null;render();say('已打开新对话，其他草稿已保留。');
}
function stop(s) {
 clearInterval(streams.get(s.id)); streams.delete(s.id); s.streaming=false;s.interrupted=true;
 const last=s.messages.at(-1);if(last) last.streaming=false;
}
function send() {
 const s=current(), input=$('app').querySelector('[data-composer]');
 if(input && composingInputs.has(input))return;
 const text=s.draft.trim();if(!text || s.pending || s.streaming)return;
 if(!s.messages.length)s.title=Array.from(text).slice(0,24).join('');
 s.messages.push({role:'user',text},{role:'assistant',text:'',streaming:true});s.draft='';s.streaming=true;s.interrupted=false;s.updated=Date.now();
 render({focus:'[data-composer]',bottom:true});say('显示预设回复。');
 let cursor=0;
 const timer=setInterval(() => {
  const m=s.messages.at(-1);m.text=baseReply.slice(0,++cursor);
  if(selected===s.id && demo) {
   const transcript=$('app').querySelector('[data-transcript]');const following=transcript && transcript.scrollHeight-transcript.scrollTop-transcript.clientHeight<80;
   const node=$('app').querySelector(`[data-message="${s.messages.length-1}"]`);if(node)node.textContent=m.text;
   if(following)transcript.scrollTop=transcript.scrollHeight;updateLatest();if(compare)mirror();
  }
  if(cursor>=baseReply.length){clearInterval(timer);streams.delete(s.id);s.streaming=false;m.streaming=false;finishStreamingView(s);say('预设回复已完成。');}
 },22);streams.set(s.id,timer);
}
$('app').addEventListener('compositionstart',e => {
 if(e.target.matches('[data-composer]')) {composingInputs.add(e.target);updateComposerState();if(compare)mirror();}
});
$('app').addEventListener('compositionend',e => {
 if(e.target.matches('[data-composer]')) {composingInputs.delete(e.target);current().draft=e.target.value;resizeComposer();updateComposerState();if(compare)mirror();}
});
$('app').addEventListener('input',e => {
 if(e.target.matches('[data-composer]')) {current().draft=e.target.value;resizeComposer();updateComposerState();if(compare)mirror();}
 if(e.target.matches('[data-search]')) {search=e.target.value;$('app').querySelectorAll('[data-history-list]').forEach(n=>n.innerHTML=historyRows());if(compare)mirror();}
});
$('app').addEventListener('change',e => {if(e.target.matches('[data-app-theme]')){theme=e.target.value;render({preserveScroll:true});}});
$('app').addEventListener('toggle',e => {if(compare && e.target.tagName==='DETAILS')mirror();},true);
$('app').addEventListener('click', async e => {
 if(e.target.matches('[data-backdrop]')){panel=null;render({preserveScroll:true,focus:'[data-action=info]'});return;}
 const row=e.target.closest('[data-session]');if(row){selected=row.dataset.session;panel=null;render();say(current().title);return;}
 const copy=e.target.closest('[data-copy]');if(copy){try{await navigator.clipboard.writeText(current().messages[Number(copy.dataset.copy)].text);copy.innerHTML=icon('check');copy.setAttribute('aria-label','已复制');say('回复已复制。');if(compare)mirror();}catch{say('当前浏览器无法复制，请选中文字复制。');}return;}
 const b=e.target.closest('[data-action]');if(!b || b.disabled)return;
 const action=b.dataset.action;
 if(['history','info','approval','computers','settings','login'].includes(action)){openPanel(action);return;}
 if(action==='close'){panel=null;render({preserveScroll:true,focus:demo?'[data-action=info]':'[data-action=history]'});}
 if(action==='back'){panel=returnPanel || 'computers';render({preserveScroll:true});}
 if(action==='new')newConversation();
 if(action==='enter'){demo=true;panel=null;if(!resumeDemo){resumeDemo=true;selected='empty';}render();}
 if(action==='leave'){
  sessions.forEach(s=>{if(s.streaming)stop(s);if(s.pending){s.pending=false;s.interrupted=true;s.messages.push({role:'assistant',text:'待确认操作已失效，没有记录授权。你可以继续发送消息。'});}});
  demo=false;resumeDemo=true;panel=null;render();say('已退出演示，对话和草稿保留。');
 }
 if(action==='example'){
  const s=current(), input=$('app').querySelector('[data-composer]');
  if(!input || s.draft.length || input.value.length || composingInputs.has(input))return;
  s.draft='从哪里开始读一个项目？';input.value=s.draft;resizeComposer();updateComposerState();input.focus({preventScroll:true});input.setSelectionRange(input.value.length,input.value.length);if(compare)mirror();
 }
 if(action==='send')send();
 if(action==='stop'){const s=current();stop(s);finishStreamingView(s);say('已暂停。');}
 if(action==='latest'){const transcript=$('app').querySelector('[data-transcript]');transcript.scrollTop=transcript.scrollHeight;updateLatest();}
 if(action==='allow' || action==='reject'){
  const s=current();if(!demo || !s.pending)return;
  s.pending=false;s.updated=Date.now();s.messages.push({role:'assistant',text:`已记录「${action==='allow'?'仅允许一次':'拒绝这次操作'}」。没有执行命令。`});panel=null;render({bottom:true,focus:'[data-composer]'});say('已记录本地选择，没有执行命令。');
 }
});
$('app').addEventListener('keydown',e => {
 if(e.key==='Escape' && panel){e.preventDefault();panel=null;render({preserveScroll:true,focus:demo?'[data-action=info]':'[data-action=history]'});return;}
 if(e.key==='Tab' && panel){const nodes=[...$('app').querySelectorAll('.sheet button:not(:disabled),.sheet input,.sheet select,.sheet textarea,.sheet summary,[tabindex="0"]')].filter(n=>!n.closest('[inert]'));if(!nodes.length)return;const first=nodes[0],last=nodes.at(-1);if(e.shiftKey && document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey && document.activeElement===last){e.preventDefault();first.focus();}}
 if(e.key==='Enter' && (e.metaKey || e.ctrlKey) && e.target.matches('[data-composer]') && !e.isComposing && e.keyCode!==229 && !composingInputs.has(e.target)){e.preventDefault();send();}
});
$('scene').addEventListener('change',e => {
 const scene=e.target.value;panel=null;
 if(scene==='entry'){demo=false;resumeDemo=false;}
 else {demo=true;if(scene==='reading')selected='reading';if(scene==='empty'){newConversation();return;}if(scene==='history')panel='history';if(scene==='approval'){selected='approval';panel='approval';}if(scene==='computers')panel='computers';}
 render();
});
$('size').addEventListener('change',e => {tablet=e.target.value==='tablet';if(tablet && compare){compare=false;$('compare').setAttribute('aria-pressed','false');$('comparison').hidden=true;}render({preserveScroll:true});});
$('theme').addEventListener('change',e => {theme=e.target.value;render({preserveScroll:true});});
$('compare').addEventListener('click',() => {compare=!compare;if(compare && tablet){tablet=false;$('size').value='phone';} $('compare').setAttribute('aria-pressed',String(compare));$('comparison').hidden=!compare;render({preserveScroll:true});});
$('type').addEventListener('click',() => {large=!large;$('type').setAttribute('aria-pressed',String(large));render({preserveScroll:true});say(large?'已开启网页大字示意，仍需原生 Dynamic Type 验证。':'已恢复默认文字。');});
window.addEventListener('resize',()=>{if(tablet)render({preserveScroll:true});});
render();
</script>
</body>
</html>
